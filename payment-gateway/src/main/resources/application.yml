server:
  port: 8084

spring:
  application:
    name: payment-gateway
  datasource:
    url: jdbc:h2:mem:gatewaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

payment:
  gateway:
    failure-rate: 0.10

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
